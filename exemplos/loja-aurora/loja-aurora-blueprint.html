<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blueprint do backend</title>
<!--
  Visualizador do blueprint do backend. Arquivo único, sem dependências e sem
  rede. Duas coisas são trocadas por projeto (modelos/montar.mjs faz isso):
    1. <style id="bp-tokens">  → cores, fontes e raios do projeto (tokens.css)
    2. <script id="bp-dados">  → o modelo (blueprint.json)
  O resto não deve ser editado à mão: os componentes só leem var(--bp-*).
-->
<style id="bp-tokens">
/* BP-TOKENS:INICIO — de exemplos/loja-aurora/tokens.css */
/*
 * Loja Aurora (projeto FICTÍCIO). Num projeto real, cada valor vem de uma
 * fonte de verdade do repositório; aqui elas são imaginárias, mas o registro
 * segue o mesmo formato:
 *   packages/ui/src/theme.ts      (paleta: indigo, pêssego, neutros)
 *   apps/admin/src/globals.css    (--radius, sombras do painel)
 * Regra da marca: índigo é a cor de ação; pêssego marca o item selecionado.
 */
:root {
  --bp-font: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; /* theme.ts fontFamily.sans */
  --bp-font-mono: "JetBrains Mono", ui-monospace, monospace;           /* theme.ts fontFamily.mono */

  --bp-bg: #f6f5fb;        /* neutral.50 */
  --bp-dot: #d2cfe3;       /* neutral.300 */
  --bp-surface: #ffffff;   /* white */
  --bp-surface-2: #f0eef8; /* neutral.100 */
  --bp-border: #1e19451a;  /* ink com 10% (o tema não tem cor de borda própria) */

  --bp-text: #1e1945;       /* ink */
  --bp-text-soft: #5c5878;  /* neutral.600 */
  --bp-text-faint: #8d89a6; /* neutral.400 */

  --bp-accent: #4a3fd0;         /* indigo.600: cor de ação */
  --bp-accent-text: #ffffff;    /* contraste 6,9:1 sobre indigo.600 */
  --bp-highlight: #ffe2d4;      /* peach.100: selecionado */
  --bp-highlight-text: #7a2f12; /* peach.900 */

  --bp-edge: #6d66b3;        /* indigo.400 */
  --bp-edge-strong: #2f278f; /* indigo.800 */

  --bp-ok: #2f8a5b;      /* success */
  --bp-warn: #8a5a00;    /* warning (texto) */
  --bp-warn-bg: #fdf1db; /* warning (fundo) */
  --bp-danger: #c2362b;  /* danger */

  --bp-radius: 12px;    /* globals.css --radius */
  --bp-radius-sm: 8px;  /* botões do painel */
  --bp-shadow: 0 1px 2px #1e19451a, 0 4px 10px -2px #1e194514;
  --bp-shadow-float: 0 4px 18px #1e194526;
}
/* BP-TOKENS:FIM */
</style>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--bp-font); color: var(--bp-text); background: var(--bp-bg);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
.mono { font-family: var(--bp-font-mono); }
code { font-family: var(--bp-font-mono); font-size: .92em; background: var(--bp-surface-2); padding: 0 .3em; border-radius: 4px; }

/* Palco do diagrama */
#palco { position: fixed; inset: 0; cursor: grab; touch-action: none; }
#palco.arrastando { cursor: grabbing; }
#palco svg { width: 100%; height: 100%; display: block; }
.no { cursor: pointer; }
.no-caixa {
  height: 100%; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 10px;
  background: var(--bp-surface); border: 1px solid var(--bp-border); border-radius: var(--bp-radius);
  box-shadow: var(--bp-shadow); transition: opacity .2s, box-shadow .2s;
}
.no-caixa.system { border: 2px dashed var(--bp-text-faint); }
.no-caixa.actor { border-radius: 999px; }
.no-caixa.selecionado { box-shadow: 0 0 0 2px var(--bp-bg), 0 0 0 4px var(--bp-edge); }
.no-icone {
  width: 34px; height: 34px; flex: none; border-radius: 999px; display: grid; place-items: center;
  background: var(--bp-highlight); color: var(--bp-highlight-text);
}
.no-nome { font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.no-tipo {
  flex: none; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--bp-text-soft); background: var(--bp-surface-2); padding: 2px 6px; border-radius: 6px;
}
.apagado { opacity: .18; }
.aresta { fill: none; stroke: var(--bp-edge); stroke-width: 1.6; transition: opacity .2s; }
.aresta.no-fluxo { stroke: var(--bp-edge-strong); stroke-width: 3; }
.aresta.seta-fluxo { stroke: var(--bp-edge-strong); stroke-width: 2.4; stroke-dasharray: 7 6; }
.rotulo {
  display: inline-flex; align-items: center; gap: 6px; max-width: 220px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; font-size: 11.5px; font-weight: 600; color: var(--bp-text);
  background: var(--bp-surface); border: 1px solid var(--bp-border); border-radius: 999px; padding: 2px 9px;
}
svg.longe .rotulo.comum { display: none; }
.rotulo.passo { border-color: var(--bp-accent); padding-left: 2px; font-size: 12px; }
.num {
  flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 999px;
  background: var(--bp-accent); color: var(--bp-accent-text); font-family: var(--bp-font-mono); font-size: 11px; font-weight: 600;
}
.num.grande { width: 30px; height: 30px; font-size: 13px; }

/* Superfícies flutuantes */
.flutuante { position: fixed; z-index: 5; background: var(--bp-surface); border: 1px solid var(--bp-border); border-radius: var(--bp-radius); box-shadow: var(--bp-shadow-float); }
#titulo { top: 16px; left: 16px; padding: 9px 14px; max-width: min(520px, calc(100vw - 32px)); }
#titulo h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#titulo p { margin: 1px 0 0; font-size: 12.5px; color: var(--bp-text-soft); }
#barra { z-index: 7; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 6px; }
.bt {
  height: 36px; min-width: 36px; padding: 0 10px; border: 0; border-radius: var(--bp-radius-sm); background: transparent;
  color: var(--bp-text-soft); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.bt:hover { background: var(--bp-surface-2); color: var(--bp-text); }
.bt.ativo { background: var(--bp-highlight); color: var(--bp-highlight-text); }
.bt:focus-visible, .item:focus-visible { outline: 2px solid var(--bp-edge); outline-offset: 2px; }
.sep { width: 1px; height: 22px; background: var(--bp-border); margin: 0 4px; }
#zoom-pct { min-width: 54px; justify-content: center; font-variant-numeric: tabular-nums; }

#busca { top: 16px; right: 16px; width: 280px; padding: 0; z-index: 7; }
#busca input { width: 100%; height: 42px; border: 0; background: transparent; padding: 0 14px; font: inherit; font-size: 14px; color: var(--bp-text); outline: none; }
#busca-res { max-height: 50vh; overflow: auto; border-top: 1px solid var(--bp-border); padding: 4px; }
#busca-res:empty { display: none; }

#fluxos { top: 80px; left: 16px; bottom: 84px; width: 300px; display: flex; flex-direction: column; overflow: hidden; }
#fluxos header, #detalhe header { padding: 12px 14px 10px; border-bottom: 1px solid var(--bp-border); }
#fluxos h2, #detalhe h2 { margin: 0; font-size: 14px; font-weight: 700; }
.lista { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; }
.item:hover { background: var(--bp-surface-2); }
.item.ativo { background: var(--bp-highlight); }
.item b { display: block; font-size: 13.5px; color: var(--bp-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { display: block; font-size: 12px; color: var(--bp-text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.variante { margin-left: 14px; width: calc(100% - 14px); border-left: 2px solid var(--bp-border); border-radius: 0 10px 10px 0; }

#detalhe { top: 80px; right: 16px; bottom: 84px; width: 380px; overflow: auto; }
#detalhe .corpo { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--bp-text-soft); }
.titulo-g { font-size: 19px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 0; }
.texto { font-size: 14px; line-height: 1.55; color: var(--bp-text-soft); }
.texto p { margin: 0 0 6px; }
.meta { display: grid; gap: 8px; background: var(--bp-surface-2); border-radius: 12px; padding: 10px 12px; }
.meta div { font-size: 13px; }
.meta span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--bp-text-faint); }
.passo-item { display: flex; gap: 10px; align-items: flex-start; }
.passo-item .item { padding: 6px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 12px; font-weight: 600; background: var(--bp-surface-2); border-radius: 6px; padding: 2px 7px; color: var(--bp-text); }
.chip.mono { font-size: 11px; color: var(--bp-text-soft); }
.bloco h4 { margin: 0 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--bp-text-soft); }
.bloco ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.bloco li { font-size: 13.5px; line-height: 1.5; display: flex; gap: 8px; }
.bloco li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 999px; margin-top: 8px; background: var(--bp-text-faint); }
.bloco.mudancas li::before { background: var(--bp-accent); }
.bloco.regras li::before { background: var(--bp-ok); }
.bloco.erros li::before { background: var(--bp-warn); }
table.atributos { width: 100%; border-collapse: separate; border-spacing: 0 3px; font-size: 12.5px; }
table.atributos td { background: var(--bp-surface-2); padding: 4px 8px; }
table.atributos td:first-child { border-radius: 6px 0 0 6px; font-weight: 600; }
table.atributos td:last-child { border-radius: 0 6px 6px 0; color: var(--bp-text-faint); font-family: var(--bp-font-mono); font-size: 11px; text-align: right; }

#apresentacao { left: 50%; bottom: 18px; transform: translateX(-50%); width: min(720px, calc(100vw - 32px)); max-height: 46vh; display: flex; flex-direction: column; z-index: 6; }
#apresentacao header { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px 10px; border-bottom: 1px solid var(--bp-border); }
#apresentacao .corpo { overflow: auto; padding: 12px 16px; display: grid; gap: 12px; }
#apresentacao footer { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--bp-border); }
.bt.primario { background: var(--bp-accent); color: var(--bp-accent-text); }
.bt.primario:hover { background: var(--bp-accent); opacity: .92; color: var(--bp-accent-text); }

/* Vista documento (e impressão) */
#documento { position: fixed; inset: 0; overflow: auto; background: var(--bp-bg); z-index: 6; padding: 84px 24px 120px; }
#documento article { max-width: 820px; margin: 0 auto 56px; }
#documento h1 { font-size: 30px; letter-spacing: -.03em; margin: 6px 0 8px; }
.passos-doc { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 14px; }
.passos-doc > li { display: flex; gap: 14px; }
.cartao { flex: 1; background: var(--bp-surface); border: 1px solid var(--bp-border); border-radius: var(--bp-radius); padding: 16px 18px; display: grid; gap: 10px; }
.cartao h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
[hidden] { display: none !important; }
/* Janela estreita (ou embutida): painéis menores, para sobrar diagrama. */
@media (max-width: 1100px) {
  #fluxos { width: 240px; }
  #detalhe { width: 300px; }
  #busca { width: 220px; }
  #titulo { max-width: calc(100vw - 270px); }
}
@media print {
  body { overflow: visible; background: #fff; }
  #palco, .flutuante { display: none !important; }
  #documento { position: static; padding: 0; overflow: visible; }
  #documento article { page-break-after: always; }
  .cartao { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="palco" aria-label="Diagrama conceitual do backend"><svg id="svg"></svg></div>

<div id="titulo" class="flutuante"><h1 id="titulo-nome"></h1><p id="titulo-resumo"></p></div>

<div id="busca" class="flutuante">
  <input id="busca-input" type="search" placeholder="Buscar conceito ou fluxo  ( / )" autocomplete="off" aria-label="Buscar" />
  <div id="busca-res" class="lista"></div>
</div>

<aside id="fluxos" class="flutuante" aria-label="Fluxos">
  <header><h2>Fluxos</h2></header>
  <div id="fluxos-lista" class="lista"></div>
</aside>

<aside id="detalhe" class="flutuante" hidden aria-live="polite"></aside>

<section id="apresentacao" class="flutuante" hidden aria-live="polite"></section>

<main id="documento" hidden></main>

<nav id="barra" class="flutuante" aria-label="Ferramentas">
  <button class="bt ativo" id="bt-fluxos" title="Lista de fluxos (L)">Fluxos</button>
  <button class="bt" id="bt-vista" title="Alternar diagrama e documento (D)">Documento</button>
  <span class="sep"></span>
  <button class="bt" id="bt-menos" title="Diminuir zoom (−)" aria-label="Diminuir zoom">−</button>
  <button class="bt" id="zoom-pct" title="Voltar a 100%">100%</button>
  <button class="bt" id="bt-mais" title="Aumentar zoom (+)" aria-label="Aumentar zoom">+</button>
  <button class="bt" id="bt-ajustar" title="Ajustar à tela (F)">Ajustar</button>
  <span class="sep"></span>
  <button class="bt" id="bt-apresentar" title="Apresentar o fluxo (P)" disabled>Apresentar</button>
  <button class="bt" id="bt-exportar" title="Baixar os fluxos em Markdown">Exportar .md</button>
</nav>

  if (B.x > A.x + A.w / 2) { x1 = A.x + A.w; x2 = B.x; const d = Math.max(40, (x2 - x1) / 2); c1 = x1 + d; c2 = x2 - d; }
  else if (B.x + B.w < A.x + A.w / 2) { x1 = A.x; x2 = B.x + B.w; const d = Math.max(40, (x1 - x2) / 2); c1 = x1 - d; c2 = x2 + d; }
  else { x1 = A.x + A.w; x2 = B.x + B.w; c1 = x1 + 70; c2 = x2 + 70; }
  const y1 = A.y + A.h / 2, y2 = B.y + B.h / 2;
  const mx = (1 - t) ** 3 * x1 + 3 * (1 - t) ** 2 * t * c1 + 3 * (1 - t) * t ** 2 * c2 + t ** 3 * x2;
  const my = (1 - t) ** 3 * y1 + 3 * (1 - t) ** 2 * t * y1 + 3 * (1 - t) * t ** 2 * y2 + t ** 3 * y2;
  return { d: `M${x1},${y1} C${c1},${y1} ${c2},${y2} ${x2},${y2}`, mx, my };
}
function rotulo(x, y, html, cls = "") {
  const w = 240, h = 26;
  const fo = el("foreignObject", { x: x - w / 2, y: y - h / 2, width: w, height: h, style: "overflow:visible;pointer-events:none" }, gRotulos);
  fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;justify-content:center;align-items:center;height:${h}px"><span class="rotulo ${cls}">${html}</span></div>`;
  return fo;
}

const vAresta = new Map(), vNo = new Map();
for (const r of R) {
  const p = caminho(r.from, r.to);
  const path = el("path", { d: p.d, class: "aresta", "marker-end": "url(#seta)" }, gArestas);
  vAresta.set(r.id, { path, p, rot: null, r });
}
for (const c of D.concepts) {
  const pos = L.get(c.id);
  const fo = el("foreignObject", { x: pos.x, y: pos.y, width: pos.w, height: pos.h, class: "no", tabindex: 0, role: "button", "aria-label": `${c.name} (${TIPO[c.kind]})` }, gNos);
  fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" class="no-caixa ${c.kind}" title="${esc(c.description ?? "")}"><span class="no-icone">${ICONE[c.kind]}</span><span class="no-nome">${esc(c.name)}</span><span class="no-tipo">${TIPO[c.kind]}</span></div>`;
  fo.addEventListener("click", (e) => { e.stopPropagation(); if (!movido) mostrarConceito(c.id); });
  fo.addEventListener("keydown", (e) => { if (e.key === "Enter") mostrarConceito(c.id); });
  vNo.set(c.id, fo);
}
const gBadges = el("g", {}, mundo);

/* ---------- câmera: arrastar e zoom ---------- */
let cam = { x: 0, y: 0, k: 1 }, movido = false;
function aplicar() {
  mundo.setAttribute("transform", `translate(${cam.x},${cam.y}) scale(${cam.k})`);
  $("zoom-pct").textContent = Math.round(cam.k * 100) + "%";
  /* De longe, os rótulos das relações comuns viram ruído: só os do fluxo ficam. */
  svg.classList.toggle("longe", cam.k < 0.7);
}
function zoomEm(k, cx, cy) {
  k = Math.min(2, Math.max(0.12, k));
  cam.x = cx - (cx - cam.x) * (k / cam.k); cam.y = cy - (cy - cam.y) * (k / cam.k); cam.k = k; aplicar();
}
/* Enquadra os nós dados descontando os painéis abertos. */
function enquadrar(ids, anim = true, area) {
  const ns = ids.length ? ids.map((i) => L.get(i)).filter(Boolean) : [...L.values()];
  if (!ns.length) return;
  const x0 = Math.min(...ns.map((n) => n.x)), y0 = Math.min(...ns.map((n) => n.y));
  const x1 = Math.max(...ns.map((n) => n.x + n.w)), y1 = Math.max(...ns.map((n) => n.y + n.h));
  const esq = $("fluxos").hidden ? 32 : $("fluxos").offsetWidth + 40;
  const dir = $("detalhe").hidden ? 32 : $("detalhe").offsetWidth + 40;
  const a = area ?? { x: esq, y: 84, w: innerWidth - esq - dir, h: innerHeight - 84 - 96 };
  const k = Math.min(1.1, Math.max(0.12, Math.min(a.w / (x1 - x0 + 80), a.h / (y1 - y0 + 80))));
  const alvo = { k, x: a.x + a.w / 2 - ((x0 + x1) / 2) * k, y: a.y + a.h / 2 - ((y0 + y1) / 2) * k };
  if (!anim) { cam = alvo; return aplicar(); }
  const ini = { ...cam }, t0 = performance.now();
  const passo = (t) => {
    const p = Math.min(1, (t - t0) / 380), e = 1 - (1 - p) ** 3;
    cam = { x: ini.x + (alvo.x - ini.x) * e, y: ini.y + (alvo.y - ini.y) * e, k: ini.k + (alvo.k - ini.k) * e };
    aplicar(); if (p < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}
const palco = $("palco");
let arraste = null;
palco.addEventListener("pointerdown", (e) => { arraste = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; movido = false; });
addEventListener("pointermove", (e) => {
  if (!arraste) return;
  const dx = e.clientX - arraste.x, dy = e.clientY - arraste.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { movido = true; palco.classList.add("arrastando"); }
  if (movido) { cam.x = arraste.cx + dx; cam.y = arraste.cy + dy; aplicar(); }
});
addEventListener("pointerup", () => { if (arraste && !movido && estado.presentacao === null) limparSelecaoConceito(); arraste = null; setTimeout(() => (movido = false)); palco.classList.remove("arrastando"); });
palco.addEventListener("wheel", (e) => { e.preventDefault(); zoomEm(cam.k * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });

/* ---------- estado: fluxo ativo, passo da apresentação ---------- */
const estado = { fluxo: null, presentacao: null, conceito: null };
const fluxo = () => F.find((f) => f.id === estado.fluxo);

function caminhoFluxo(f) {
  const nos = new Map(), rels = new Map(), setas = [];
  const add = (m, k, n) => { const l = m.get(k) ?? []; if (!l.includes(n)) m.set(k, [...l, n]); };
  f.steps.forEach((s, i) => {
    const n = i + 1;
    add(nos, s.from, n); if (s.to) add(nos, s.to, n);
    if (!s.to || s.to === s.from) return;
    const r = relPorPar.get(par(s.from, s.to));
    if (r) add(rels, r.id, n); else setas.push({ n, de: s.from, para: s.to, acao: s.action });
  });
  return { nos, rels, setas };
}

function desenharDestaque() {
  const f = fluxo();
  const cp = f ? caminhoFluxo(f) : null;
  gSetas.replaceChildren(); gBadges.replaceChildren(); gRotulos.replaceChildren();
  for (const [id, fo] of vNo) {
    const caixa = fo.firstChild;
    caixa.classList.toggle("apagado", !!cp && !cp.nos.has(id) && estado.conceito !== id);
    caixa.classList.toggle("selecionado", estado.conceito === id);
    const nums = cp?.nos.get(id);
    if (nums) {
      const pos = L.get(id);
      nums.forEach((n, i) => {
        const g = el("foreignObject", { x: pos.x - 12 + i * 34, y: pos.y - 15, width: 32, height: 32, style: "overflow:visible;pointer-events:none" }, gBadges);
        g.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml"><span class="num grande">${n}</span></div>`;
      });
    }
  }
  for (const [id, a] of vAresta) {
    const nums = cp?.rels.get(id);
    a.path.classList.toggle("no-fluxo", !!nums);
    a.path.classList.toggle("apagado", !!cp && !nums);
    a.path.setAttribute("marker-end", nums ? "url(#seta-forte)" : "url(#seta)");
    if (nums) {
      nums.forEach((n, i) => rotulo(a.p.mx, a.p.my + i * 28 - ((nums.length - 1) * 14), `<span class="num">${n}</span>${esc(f.steps[n - 1].action || a.r.label)}`, "passo"));
    } else {
      const fo = rotulo(a.p.mx, a.p.my, esc(a.r.label), "comum");
      if (cp) fo.classList.add("apagado");
    }
  }
  for (const s of cp?.setas ?? []) {
    /* Rótulo da seta a 35% do caminho: no meio ficaria sobre o das relações. */
    const p = caminho(s.de, s.para, 0.35);
    el("path", { d: p.d, class: "aresta seta-fluxo", "marker-end": "url(#seta-forte)" }, gSetas);
    rotulo(p.mx, p.my, `<span class="num">${s.n}</span>${esc(s.acao || T.step)}`, "passo");
  }
}

/* ---------- lista de fluxos ---------- */
function listaFluxos() {
  const principais = F.filter((f) => !f.variantOf || !F.some((g) => g.id === f.variantOf));
  const html = [];
  const item = (f, variante) => `<button class="item ${variante ? "variante" : ""} ${estado.fluxo === f.id ? "ativo" : ""}" data-fluxo="${esc(f.id)}"><b>${esc(f.name)}</b><small>${variante ? T.variant + " · " : ""}${f.steps.length} ${f.steps.length === 1 ? T.step : T.steps}${f.actor ? " · " + esc(f.actor) : ""}</small></button>`;
  for (const f of principais) {
    html.push(item(f, false));
    for (const v of F.filter((g) => g.variantOf === f.id)) html.push(item(v, true));
  }
  $("fluxos-lista").innerHTML = html.join("") || `<p class="texto" style="padding:8px">${T.noFlows}</p>`;
}
$("fluxos-lista").addEventListener("click", (e) => { const b = e.target.closest("[data-fluxo]"); if (b) selecionarFluxo(b.dataset.fluxo); });

function selecionarFluxo(id, { enquadra = true } = {}) {
  estado.fluxo = estado.fluxo === id && enquadra ? null : id;
  estado.conceito = null; estado.presentacao = null;
  $("apresentacao").hidden = true;
  $("bt-apresentar").disabled = !estado.fluxo;
  listaFluxos(); desenharDestaque(); painelFluxo(); hash();
  /* Em janela estreita, a lista sai da frente ao escolher um fluxo (L volta). */
  if (estado.fluxo && innerWidth < 1100 && $("bt-fluxos").classList.contains("ativo")) $("bt-fluxos").click();
  if (enquadra) {
    const f = fluxo();
    enquadrar(f ? [...new Set(f.steps.flatMap((s) => (s.to ? [s.from, s.to] : [s.from])))] : []);
  }
}

/* ---------- painel de detalhe ---------- */

  return `${s.description ? `<div class="texto">${md(s.description)}</div>` : ""}${lista(T.changes, "mudancas", s.changes)}${lista(T.rules, "regras", s.rules)}${lista(T.errors, "erros", s.errors)}${tambem}${s.source ? `<div class="chip mono">${esc(s.source)}</div>` : ""}`;

const quem = (s) => `<div class="chips"><span class="chip">${esc(nome(s.from))}</span>${s.to && s.to !== s.from ? `<span aria-hidden="true">→</span><span class="chip">${esc(nome(s.to))}</span>` : ""}${s.action ? `<em class="texto" style="font-size:13px">· ${esc(s.action)}</em>` : ""}</div>`;
function meta(f) {

  return linhas.length ? `<div class="meta">${linhas.map(([k, v]) => `<div><span>${k}</span>${inline(v)}</div>`).join("")}</div>` : "";
}
function painelFluxo() {

  p.innerHTML = `<header><div class="kicker">${T.flow}${principal ? " · " + T.variantOf + " " + esc(principal.name) : ""}</div><div class="titulo-g">${esc(f.name)}</div></header>
  <div class="corpo">${f.summary ? `<div class="texto">${md(f.summary)}</div>` : ""}${meta(f)}

  p.hidden = false;
}
$("detalhe").addEventListener("click", (e) => {
  const b = e.target.closest("[data-passo]"); if (b) return apresentar(+b.dataset.passo);
  const c = e.target.closest("[data-fluxo]"); if (c) return selecionarFluxo(c.dataset.fluxo);
});
function mostrarConceito(id) {
  const c = C.get(id); if (!c) return;
  estado.conceito = id;
  const rels = R.filter((r) => r.from === id || r.to === id);
  const usados = F.filter((f) => f.steps.some((s) => s.from === id || s.to === id || s.also?.includes(id)));
  const p = $("detalhe");
  p.innerHTML = `<header><div class="kicker">${TIPO[c.kind]}</div><div class="titulo-g">${esc(c.name)}</div>${c.code ? `<div class="chip mono" style="display:inline-block;margin-top:4px">${esc(c.code)}</div>` : ""}</header>
  <div class="corpo">${c.description ? `<div class="texto">${md(c.description)}</div>` : ""}
  ${c.attributes?.length ? `<div class="bloco"><h4>${T.attributes} (${c.attributes.length})</h4><table class="atributos">${c.attributes.map((a) => `<tr><td>${a.pk ? "🔑 " : ""}${esc(a.label ?? a.name)}</td><td class="mono" style="color:var(--bp-text-faint)">${esc(a.name)}</td><td>${a.fk ? "→ " + esc(a.fk) : esc(a.values?.join(" / ") ?? a.type ?? "")}</td></tr>`).join("")}</table></div>` : ""}
  ${rels.length ? `<div class="bloco"><h4>${T.relations} (${rels.length})</h4><ul>${rels.map((r) => `<li><span>${esc(nome(r.from))} <em>${esc(r.label)}</em> ${esc(nome(r.to))}${r.cardinality ? ` <span class="mono" style="color:var(--bp-text-faint)">${esc(r.cardinality.join(" : "))}</span>` : ""}</span></li>`).join("")}</ul></div>` : ""}
  ${usados.length ? `<div class="bloco"><h4>${T.inFlows}</h4>${usados.map((f) => `<button class="item" data-fluxo="${esc(f.id)}"><b>${esc(f.name)}</b></button>`).join("")}</div>` : ""}</div>`;
  p.hidden = false; desenharDestaque();
}
function limparSelecaoConceito() {
  if (!estado.conceito) return;
  estado.conceito = null; desenharDestaque();
  if (estado.fluxo) painelFluxo(); else $("detalhe").hidden = true;
}

/* ---------- apresentação ---------- */
function apresentar(i) {
  const f = fluxo(); if (!f) return;
  if (i === null || i < 0 || i >= f.steps.length) { estado.presentacao = null; $("apresentacao").hidden = true; $("barra").hidden = false; $("fluxos").hidden = !$("bt-fluxos").classList.contains("ativo"); painelFluxo(); return hash(); }
  estado.presentacao = i;
  const s = f.steps[i], ult = i === f.steps.length - 1;
  $("fluxos").hidden = true; $("detalhe").hidden = true; $("barra").hidden = true;
  const a = $("apresentacao");
  a.innerHTML = `<header><span class="num grande">${i + 1}</span><div style="flex:1;min-width:0"><div class="kicker">${esc(f.name)} · ${T.stepOf(i + 1, f.steps.length)}</div><div class="titulo-g">${esc(s.title)}</div>${quem(s)}</div><button class="bt" data-acao="sair" aria-label="${T.exit}">✕</button></header>
  <div class="corpo">${blocos(s)}</div>
  <footer><button class="bt" data-acao="ant" ${i === 0 ? "disabled" : ""}>${T.prev}</button><span class="texto" style="flex:1;text-align:center;font-size:13px">${ult ? esc(f.outcome || T.end) : T.nextIs + esc(f.steps[i + 1].title)}</span><button class="bt primario" data-acao="prox">${ult ? T.finish : T.next}</button></footer>`;
  a.hidden = false;
  const ids = s.to ? [s.from, s.to] : [s.from];
  enquadrar(ids, true, { x: innerWidth * 0.15, y: 96, w: innerWidth * 0.7, h: innerHeight * 0.5 - 96 });
  hash();
}
$("apresentacao").addEventListener("click", (e) => {

  if (b.dataset.acao === "sair") apresentar(null);
  if (b.dataset.acao === "ant") apresentar(i - 1);
  if (b.dataset.acao === "prox") apresentar(i + 1 < fluxo().steps.length ? i + 1 : null);
});

/* ---------- documento (leitura e impressão) ---------- */
function documento(lista) {
  return lista.map((f) => {
    const principal = f.variantOf && F.find((g) => g.id === f.variantOf);
    return `<article><div class="kicker">${T.flow} · ${esc(D.project.name)}</div><h1>${esc(f.name)}</h1>${principal ? `<p class="texto">${T.variantOfDoc} <strong>${esc(principal.name)}</strong>.</p>` : ""}
    ${f.summary ? `<div class="texto" style="font-size:16px">${md(f.summary)}</div>` : ""}${meta(f)}
    <ol class="passos-doc">${f.steps.map((s, i) => `<li><span class="num grande">${i + 1}</span><div class="cartao"><h3>${esc(s.title)}</h3>${quem(s)}${blocos(s)}</div></li>`).join("")}</ol></article>`;
  }).join("");
}
function alternarVista(forcar) {

  doc.hidden = !mostrar;

addEventListener("beforeprint", () => { $("documento").innerHTML = documento(fluxo() ? [fluxo()] : F); });
addEventListener("afterprint", () => { if ($("documento").hidden) $("documento").innerHTML = ""; });

/* ---------- exportar markdown ---------- */
function markdown(f) {
  const o = [`# ${f.name}`, ""];
  const principal = f.variantOf && F.find((g) => g.id === f.variantOf);
  if (principal) o.push(`_${T.variantOfDoc} **${principal.name}**._`, "");
  if (f.summary) o.push(f.summary.trim(), "");
  for (const [k, v] of [[T.who, f.actor], [T.starts, f.trigger], [T.ends, f.outcome]]) if (v) o.push(`- **${k}:** ${v}`);
  o.push("", `## ${LANG === "en" ? "Steps" : "Passos"} (${f.steps.length})`, "");
  f.steps.forEach((s, i) => {
    o.push(`### ${i + 1}. ${s.title}`, "", `**${nome(s.from)}**${s.to && s.to !== s.from ? ` → **${nome(s.to)}**` : ""}${s.action ? `: _${s.action}_` : ""}`, "");
    if (s.description) o.push(s.description.trim(), "");
    for (const [t, l] of [[T.changes, s.changes], [T.rules, s.rules], [T.errors, s.errors]]) if (l?.length) o.push(`**${t}**`, "", ...l.map((x) => `- ${x}`), "");
    if (s.also?.length) o.push(`**${T.also}:** ${s.also.map(nome).join(", ")}`, "");
    if (s.source) o.push(`${T.source}: \`${s.source}\``, "");
  });
  return o.join("\n").trimEnd() + "\n";
}
$("bt-exportar").addEventListener("click", () => {
  const f = fluxo(), lista = f ? [f] : F;
  const texto = lista.map(markdown).join("\n---\n\n");
  const slug = (f ? f.name : D.project.name).normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texto], { type: "text/markdown;charset=utf-8" }));
  a.download = `${slug || "flows"}.md`; a.click(); URL.revokeObjectURL(a.href);
});

$("bt-mais").addEventListener("click", () => zoomEm(cam.k * 1.2, innerWidth / 2, innerHeight / 2));

$("bt-ajustar").addEventListener("click", () => { const f = fluxo(); enquadrar(f ? [...new Set(f.steps.flatMap((s) => (s.to ? [s.from, s.to] : [s.from])))] : []); });
$("bt-apresentar").addEventListener("click", () => apresentar(0));
addEventListener("keydown", (e) => {
  if (e.target.closest?.("input, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (estado.presentacao !== null) {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); apresentar(estado.presentacao + 1 < fluxo().steps.length ? estado.presentacao + 1 : null); }
    else if (e.key === "ArrowLeft") apresentar(Math.max(0, estado.presentacao - 1));
    else if (e.key === "Escape") apresentar(null);
    return;
  }
  if (e.key === "/") { e.preventDefault(); $("busca-input").focus(); }
  else if (e.key === "l" || e.key === "L") $("bt-fluxos").click();
  else if (e.key === "d" || e.key === "D") alternarVista();
  else if (e.key === "f" || e.key === "F") $("bt-ajustar").click();
  else if ((e.key === "p" || e.key === "P") && fluxo()) apresentar(0);
  else if (e.key === "+" || e.key === "=") $("bt-mais").click();
  else if (e.key === "-") $("bt-menos").click();
  else if (e.key === "Escape") { if (!$("documento").hidden) alternarVista(false); else if (estado.conceito) limparSelecaoConceito(); else if (estado.fluxo) selecionarFluxo(estado.fluxo); }
});

/* ---------- link direto: #fluxo=<id>&passo=<n> ---------- */
function hash() {
  const p = new URLSearchParams();
  if (estado.fluxo) p.set("fluxo", estado.fluxo);
  if (estado.presentacao !== null) p.set("passo", estado.presentacao + 1);
  history.replaceState(null, "", p.toString() ? "#" + p : location.pathname + location.search);
}

$("bt-mais").setAttribute("aria-label", T.zoomIn); $("bt-mais").title = T.zoomIn + " (+)";
$("bt-menos").setAttribute("aria-label", T.zoomOut); $("bt-menos").title = T.zoomOut + " (−)";
$("zoom-pct").title = T.zoomReset;
$("busca-input").placeholder = T.search; $("busca-input").setAttribute("aria-label", T.searchLabel);
$("palco").setAttribute("aria-label", T.diagramLabel); $("barra").setAttribute("aria-label", T.toolsLabel);
$("fluxos").setAttribute("aria-label", T.flows);
listaFluxos(); aplicar(); desenharDestaque(); enquadrar([], false);

{
